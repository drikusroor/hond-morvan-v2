backend:
  name: github
  repo: drikusroor/hond-morvan-v2
  branch: main
  base_url: https://sveltia-cms-auth.drikusroor.workers.dev

# Enable local backend for development (no file changes needed!)
local_backend: true

# Publish mode
publish_mode: editorial_workflow

# Localization
locale: nl

# Media and Public Folders
media_folder: "src/assets/images"
public_folder: "../../assets/images"

site_url: "https://drikusroor.github.io/hond-morvan-v2"
display_url: "https://drikusroor.github.io/hond-morvan-v2"

# Collections
collections:
  # Pages Collection
  - name: "pages"
    label: "Pagina's"
    files:
      - label: "Home"
        name: "home"
        file: "src/content/pages/home.md"
        fields:
          - {label: "Titel", name: "title", widget: "string"}
          - {label: "Header afbeelding", name: "headerImage", widget: "image", required: false}
          - {label: "Beschrijving", name: "description", widget: "text", required: false}
          - {label: "Inhoud", name: "body", widget: "markdown"}
          - {label: "Foto's linkerkolom", name: "leftColumnImages", widget: "list", required: false, min: 0, max: 5, field: {label: "Afbeelding", name: "image", widget: "image"}}
          - {label: "Foto's rechterkolom", name: "rightColumnImages", widget: "list", required: false, min: 0, max: 5, field: {label: "Afbeelding", name: "image", widget: "image"}}
          - {label: "Onderste afbeelding(en)", name: "bottomImages", widget: "list", required: false, min: 0, max: 5, field: {label: "Afbeelding", name: "image", widget: "image"}}
      
      - label: "Kaart"
        name: "kaart"
        file: "src/content/pages/kaart.md"
        fields:
          - {label: "Titel", name: "title", widget: "string"}
          - {label: "Header afbeelding", name: "headerImage", widget: "image", required: false}
          - {label: "Beschrijving", name: "description", widget: "text", required: false}
          - {label: "Inhoud", name: "body", widget: "markdown"}
          - {label: "Foto's linkerkolom", name: "leftColumnImages", widget: "list", required: false, min: 0, max: 5, field: {label: "Afbeelding", name: "image", widget: "image"}}
          - {label: "Foto's rechterkolom", name: "rightColumnImages", widget: "list", required: false, min: 0, max: 5, field: {label: "Afbeelding", name: "image", widget: "image"}}
          - {label: "Onderste afbeelding(en)", name: "bottomImages", widget: "list", required: false, min: 0, max: 5, field: {label: "Afbeelding", name: "image", widget: "image"}}
     
      - label: "Gastenboek"
        name: "gastenboek"
        file: "src/content/pages/gastenboek.md"
        fields:
          - {label: "Titel", name: "title", widget: "string"}
          - {label: "Header afbeelding", name: "headerImage", widget: "image", required: false}
          - {label: "Beschrijving", name: "description", widget: "text", required: false}
          - {label: "Inhoud", name: "body", widget: "markdown"}
          - {label: "Foto's linkerkolom", name: "leftColumnImages", widget: "list", required: false, min: 0, max: 5, field: {label: "Afbeelding", name: "image", widget: "image"}}
          - {label: "Foto's rechterkolom", name: "rightColumnImages", widget: "list", required: false, min: 0, max: 5, field: {label: "Afbeelding", name: "image", widget: "image"}}
          - {label: "Onderste afbeelding(en)", name: "bottomImages", widget: "list", required: false, min: 0, max: 5, field: {label: "Afbeelding", name: "image", widget: "image"}}

      - label: "Tarieven"
        name: "tarieven"
        file: "src/content/pages/tarieven.md"
        fields:
          - {label: "Titel", name: "title", widget: "string"}
          - {label: "Header afbeelding", name: "headerImage", widget: "image", required: false}
          - {label: "Beschrijving", name: "description", widget: "text", required: false}
          - {label: "Inhoud", name: "body", widget: "markdown"}
          - {label: "Foto's linkerkolom", name: "leftColumnImages", widget: "list", required: false, min: 0, max: 5, field: {label: "Afbeelding", name: "image", widget: "image"}}
          - {label: "Foto's rechterkolom", name: "rightColumnImages", widget: "list", required: false, min: 0, max: 5, field: {label: "Afbeelding", name: "image", widget: "image"}}
          - {label: "Onderste afbeelding(en)", name: "bottomImages", widget: "list", required: false, min: 0, max: 5, field: {label: "Afbeelding", name: "image", widget: "image"}}
    
      - label: "Links"
        name: "links"
        file: "src/content/pages/links.md"
        fields:
          - {label: "Titel", name: "title", widget: "string"}
          - {label: "Header afbeelding", name: "headerImage", widget: "image", required: false}
          - {label: "Beschrijving", name: "description", widget: "text", required: false}
          - {label: "Inhoud", name: "body", widget: "markdown"}
          - {label: "Foto's linkerkolom", name: "leftColumnImages", widget: "list", required: false, min: 0, max: 5, field: {label: "Afbeelding", name: "image", widget: "image"}}
          - {label: "Foto's rechterkolom", name: "rightColumnImages", widget: "list", required: false, min: 0, max: 5, field: {label: "Afbeelding", name: "image", widget: "image"}}
          - {label: "Onderste afbeelding(en)", name: "bottomImages", widget: "list", required: false, min: 0, max: 5, field: {label: "Afbeelding", name: "image", widget: "image"}}
   
      - label: "Contact"
        name: "contact"
        file: "src/content/pages/contact.md"
        fields:
          - {label: "Titel", name: "title", widget: "string"}
          - {label: "Header afbeelding", name: "headerImage", widget: "image", required: false}
          - {label: "Beschrijving", name: "description", widget: "text", required: false}
          - {label: "Inhoud", name: "body", widget: "markdown"}
          - {label: "Foto's linkerkolom", name: "leftColumnImages", widget: "list", required: false, min: 0, max: 5, field: {label: "Afbeelding", name: "image", widget: "image"}}
          - {label: "Foto's rechterkolom", name: "rightColumnImages", widget: "list", required: false, min: 0, max: 5, field: {label: "Afbeelding", name: "image", widget: "image"}}
          - {label: "Onderste afbeelding(en)", name: "bottomImages", widget: "list", required: false, min: 0, max: 5, field: {label: "Afbeelding", name: "image", widget: "image"}}
      
  # Testimonials Collection
  - name: "testimonials"
    label: "Gastenboek"
    label_singular: "Review"
    folder: "src/content/testimonials"
    # show name and date in the list view
    summary: "{{name}} - {{date}}"
    # sort by most testimonials first
    sortable_fields: ['date', 'name', 'rating']
    default_sort: 'date:desc'
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - {label: "Gast naam", name: "name", widget: "string"}
      - {label: "Datum", name: "date", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false}
      - {label: "Locatie", name: "location", widget: "string", required: false}
      - {label: "Beoordeling", name: "rating", widget: "number", value_type: "float", min: 1, max: 5, step: 0.5, default: 5}
      - {label: "Foto", name: "photo", widget: "image", required: false}
      - {label: "Bericht", name: "body", widget: "text"}
  
  # Bookings Collection
  - name: "bookings"
    label: "Boekingen"
    label_singular: "Boeking"
    folder: "src/content/bookings"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: "guestName"
    summary: "{{guestName}} - {{startDate}} tot {{endDate}}"
    sortable_fields: ['startDate', 'endDate', 'guestName']
    fields:
      - {label: "Gast naam (optioneel)", name: "guestName", widget: "string", required: false, hint: "Laat leeg als u anoniem wilt blijven"}
      - {label: "Start datum", name: "startDate", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, picker_utc: false}
      - {label: "Eind datum", name: "endDate", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, picker_utc: false}
      - {label: "Status", name: "status", widget: "select", options: ["gereserveerd", "bevestigd", "geblokkeerd"], default: "gereserveerd", hint: "Gereserveerd = voorlopige boeking, Bevestigd = definitieve boeking, Geblokkeerd = niet beschikbaar"}
      - {label: "Notities (privé)", name: "notes", widget: "text", required: false, hint: "Deze notities zijn alleen voor u zichtbaar"}
